--- 
# TinyTapeout project information
project:
  urn: "empty"
  title: "Universal Memory Cell (16-Byte Hybrid Persistent-RAM)"
  author: "Dharshan Kumar"
  description: "A 16-byte universal memory array combining RAM and persistent storage."
  language: "Verilog"
  clock_hz: 50000000

# How many tiles your design occupies
tiles: "1x1"

# Top module name
top_module: "tt_um_universal_memory"

# Pinout definition for the datasheet
pinout:
  # ui_in: Dedicated inputs (Write Data Payload)
  ui[0]: "data_in[0]"
  ui[1]: "data_in[1]"
  ui[2]: "data_in[2]"
  ui[3]: "data_in[3]"
  ui[4]: "data_in[4]"
  ui[5]: "data_in[5]"
  ui[6]: "data_in[6]"
  ui[7]: "data_in[7]"

  # uo_out: Dedicated outputs (Read Data Port)
  uo[0]: "data_out[0]"
  uo[1]: "data_out[1]"
  uo[2]: "data_out[2]"
  uo[3]: "data_out[3]"
  uo[4]: "data_out[4]"
  uo[5]: "data_out[5]"
  uo[6]: "data_out[6]"
  uo[7]: "data_out[7]"

  # uio_in: Address & Control pins
  uio[0]: "addr[0]"
  uio[1]: "addr[1]"
  uio[2]: "addr[2]"
  uio[3]: "addr[3]"
  uio[4]: "unused"
  uio[5]: "write_enable"
  uio[6]: "chip_enable"
  uio[7]: "persist_mode"
